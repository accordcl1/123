name: CI pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: back/go.sum

      - name: Go vet (lint)
        working-directory: ./back
        run: go vet ./...
      - name: run go tests
        working-directory: ./back
        run: go test -v ./...
      - name: docker back linter
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: back/Dockerfile
      - name: docker front linter
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: front/Dockerfile
      - name: compose linter
        run: docker compose config -q

      - name: Build and run Docker containers
        run: |
          docker compose up -d --build
          sleep 5
          docker compose ps
          docker compose logs
