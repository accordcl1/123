name: CI pipeline
on:
  push:
    brances: [main]
  pull_request:
    branches: [main]
    
jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Ge vet (lint)
        working-directory: ./back
        run: go vet ./...

        - name: Build Docker images
        - run: docker compose build
