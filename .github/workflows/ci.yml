name: CI pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Go vet (lint)
        working-directory: ./back
        run: go vet ./...

      - name: Build and run Docker containers
        run: |
          docker compose up -d --build
          sleep 5
          docker compose ps
          docker compose logs
