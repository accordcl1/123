version: '3.8'

services:
  backend:
    build: ./back
    container_name: api-back
    networks:
      - app-net
    restart: always
  frontend:
    build: ./front
    container_name: api-front
    ports:
      - "8081:80"
    networks:
      - app-net
    restart: always
networks:
  app-net:
    driver: bridge
