<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>API Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); text-align: center; width: 400px; }
        h1 { color: #38bdf8; font-size: 24px; margin-bottom: 10px; }
        p { color: #94a3b8; }
        .metric { font-size: 48px; font-weight: bold; color: #4ade80; margin: 20px 0; }
        button { background: #38bdf8; border: none; color: #0f172a; padding: 10px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0ea5e9; }
    </style>
</head>
<body>
    <div class="card">
        <h1>API Dashboard</h1>
        <p id="status">Загрузка данных с бэкенда...</p>
        <div class="metric" id="metric">-</div>
        <button onclick="fetchData()">Обновить данные</button>
    </div>
    <script>
        function fetchData() {
            fetch('/api')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('status').innerText = data.message;
                    document.getElementById('metric').innerText = data.random_metric;
                })
                .catch(err => {
                    document.getElementById('status').innerText = 'Ошибка соединения с бэкендом';
                    document.getElementById('metric').innerText = 'X';
                });
        }
        fetchData();
    </script>
</body>
</html>
